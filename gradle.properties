org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is left OFF deliberately. It interacts badly with some
# Compose Multiplatform and KSP tasks; turn it on once the build is stable and
# you can tell a real failure from a cache failure.
# org.gradle.configuration-cache=true

kotlin.code.style=official

# Android target is declared from day one so that commonMain is type-checked
# against Android's API surface too, even though no APK is built until v2.
# See "How the Multiplatform Build Works" in the plan note.
android.useAndroidX=true
android.nonTransitiveRClass=true
